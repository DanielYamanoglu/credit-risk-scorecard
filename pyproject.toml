[project]
name = "credit-risk-scorecard"
version = "0.1.0"
description = "Probability-of-default model for credit card clients: WoE scorecard and monotonic gradient boosting, validated with banking metrics"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "xlrd>=2.0",
    "matplotlib>=3.9",
    "joblib>=1.4",
]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
credit-risk = "credit_risk.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/credit_risk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
